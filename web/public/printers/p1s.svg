<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Bambu Lab P1S 3D printer">
  <defs>
    <linearGradient id="p1s-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33373c"/>
      <stop offset="0.6" stop-color="#26292d"/>
      <stop offset="1" stop-color="#1e2226"/>
    </linearGradient>
    <linearGradient id="p1s-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2125"/>
      <stop offset="1" stop-color="#171a1e"/>
    </linearGradient>
    <linearGradient id="p1s-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4248"/>
      <stop offset="1" stop-color="#2b2f34"/>
    </linearGradient>
    <linearGradient id="p1s-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2027"/>
      <stop offset="0.5" stop-color="#10151a"/>
      <stop offset="1" stop-color="#0a0e12"/>
    </linearGradient>
    <linearGradient id="p1s-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- right side face -->
  <path d="M245 55 L273 37 L273 252 L245 270 Z" fill="url(#p1s-side)" stroke="#111417" stroke-width="2" stroke-linejoin="round"/>
  <!-- top face -->
  <path d="M55 55 L83 37 L273 37 L245 55 Z" fill="url(#p1s-top)" stroke="#111417" stroke-width="2" stroke-linejoin="round"/>
  <!-- front face -->
  <rect x="55" y="55" width="190" height="215" rx="7" fill="url(#p1s-front)" stroke="#111417" stroke-width="2"/>

  <!-- glass door -->
  <rect x="69" y="69" width="162" height="154" rx="4" fill="url(#p1s-glass)" stroke="#121619" stroke-width="2"/>

  <!-- interior gantry + toolhead -->
  <rect x="78" y="114" width="144" height="6" rx="2" fill="#3f464d"/>
  <rect x="140" y="100" width="19" height="23" rx="3" fill="#4b525a"/>

  <!-- interior build plate -->
  <path d="M88 188 L208 188 L226 210 L70 210 Z" fill="#242a30" stroke="#181d22" stroke-width="1.5"/>
  <path d="M88 188 L208 188 L220 202 L76 202 Z" fill="#313a42" opacity="0.6"/>

  <!-- glass sheen -->
  <path d="M75 75 L124 75 L90 217 L75 217 Z" fill="url(#p1s-sheen)"/>

  <!-- door handle -->
  <rect x="74" y="124" width="8" height="42" rx="4" fill="#565d65" stroke="#1b2024" stroke-width="1"/>

  <!-- top lid reflection -->
  <path d="M88 41 L118 41 L96 51 L78 51 Z" fill="#ffffff" opacity="0.1"/>

  <!-- lower panel + feet -->
  <rect x="69" y="226" width="162" height="24" rx="3" fill="#202429" opacity="0.9"/>
  <rect x="62" y="266" width="26" height="7" rx="3" fill="#171b1f"/>
  <rect x="212" y="266" width="26" height="7" rx="3" fill="#171b1f"/>
  <rect x="255" y="249" width="12" height="7" rx="3" fill="#15181c"/>

  <!-- small mono screen -->
  <rect x="192" y="230" width="32" height="16" rx="2" fill="#0e1216" stroke="#3d444b" stroke-width="1.2"/>
  <rect x="197" y="234" width="22" height="8" rx="1" fill="#12301f"/>
  <circle cx="201" cy="238" r="1.8" fill="#3ddc97"/>
</svg>
