<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Bambu Lab A1 3D printer">
  <defs>
    <linearGradient id="a1-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5058"/>
      <stop offset="1" stop-color="#2f353c"/>
    </linearGradient>
    <linearGradient id="a1-post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d545c"/>
      <stop offset="0.5" stop-color="#3a4047"/>
      <stop offset="1" stop-color="#282d33"/>
    </linearGradient>
    <linearGradient id="a1-bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f464e"/>
      <stop offset="1" stop-color="#232830"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <path d="M52 232 L262 232 L282 252 L72 252 Z" fill="#262b31" stroke="#16191d" stroke-width="2" stroke-linejoin="round"/>
  <rect x="52" y="232" width="210" height="26" rx="4" fill="url(#a1-base)" stroke="#16191d" stroke-width="2"/>

  <!-- vertical posts -->
  <rect x="60" y="58" width="13" height="178" rx="4" fill="url(#a1-post)" stroke="#16191d" stroke-width="2"/>
  <rect x="238" y="58" width="13" height="178" rx="4" fill="url(#a1-post)" stroke="#16191d" stroke-width="2"/>

  <!-- top gantry bar -->
  <rect x="60" y="52" width="191" height="15" rx="6" fill="url(#a1-post)" stroke="#16191d" stroke-width="2"/>
  <rect x="70" y="56" width="171" height="3" rx="1.5" fill="#6b737d" opacity="0.5"/>

  <!-- toolhead carriage -->
  <rect x="139" y="64" width="34" height="34" rx="5" fill="#525a63" stroke="#171b20" stroke-width="2"/>
  <rect x="147" y="74" width="18" height="12" rx="2" fill="#3ddc97" opacity="0.6"/>
  <path d="M152 98 L160 110 L168 98 Z" fill="#2b3138" stroke="#171b20" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- bed -->
  <path d="M78 200 L234 200 L250 228 L62 228 Z" fill="url(#a1-bed)" stroke="#171b20" stroke-width="2" stroke-linejoin="round"/>
  <path d="M84 204 L228 204 L241 225 L71 225 Z" fill="#39414a" opacity="0.55"/>

  <!-- lead screws -->
  <rect x="86" y="120" width="4" height="82" rx="2" fill="#5b636c" opacity="0.7"/>
  <rect x="222" y="120" width="4" height="82" rx="2" fill="#5b636c" opacity="0.7"/>

  <!-- front screen -->
  <rect x="176" y="236" width="52" height="18" rx="2" fill="#0f1317" stroke="#454d56" stroke-width="1.4"/>
  <rect x="181" y="240" width="42" height="10" rx="1.5" fill="#0d2a1e"/>
  <circle cx="186" cy="245" r="2" fill="#3ddc97"/>
  <rect x="192" y="243" width="24" height="3" rx="1.5" fill="#3ddc97" opacity="0.55"/>

  <!-- feet -->
  <rect x="62" y="258" width="22" height="6" rx="3" fill="#1b1f24"/>
  <rect x="232" y="258" width="22" height="6" rx="3" fill="#1b1f24"/>
  <rect x="268" y="254" width="12" height="6" rx="3" fill="#1b1f24"/>
</svg>
